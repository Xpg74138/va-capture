<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242a38"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </linearGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect x="11" y="11" width="234" height="234" rx="55" fill="url(#bg)"/>

  <!-- 麦克风阵列引导圈 -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#46505f" stroke-width="1.6"/>

  <!-- 摄像头（圆形）：机身 -> 镜头 -> 瞳孔 -> 高光 -->
  <circle cx="128" cy="128" r="40.5" fill="#2c3344" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="128" cy="128" r="26.4" fill="#0c0f14" stroke="#4ade80" stroke-width="5.6"/>
  <circle cx="128" cy="128" r="12.3" fill="#4ade80"/>
  <circle cx="128" cy="128" r="4.6" fill="#0c0f14"/>

  <!-- 录制红点（机身右上 45 度） -->
  <circle cx="156.5" cy="99.5" r="6.1" fill="#f87171"/>

  <!-- 8 颗麦克风 -->
  <g fill="#facc15">
    <circle cx="128" cy="36" r="7.2"/><circle cx="193" cy="63" r="7.2"/>
    <circle cx="220" cy="128" r="7.2"/><circle cx="193" cy="193" r="7.2"/>
    <circle cx="128" cy="220" r="7.2"/><circle cx="63" cy="193" r="7.2"/>
    <circle cx="36" cy="128" r="7.2"/><circle cx="63" cy="63" r="7.2"/>
  </g>
</svg>
