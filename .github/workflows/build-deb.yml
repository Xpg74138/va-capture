name: build-deb

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建 .deb
        run: ./packaging/build-deb.sh

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/*.deb

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/*.deb \
            --title "VA Capture ${GITHUB_REF_NAME}" \
            --generate-notes
